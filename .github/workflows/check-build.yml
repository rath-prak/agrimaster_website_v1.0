name: Check Build

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'docs/**'

jobs:
  check-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build site from source
      run: |
        cd src
        python3 build.py
        cd ..
        cp src/styles.css docs/
        cp -r src/assets docs/
    
    - name: Check if docs/ is up to date
      run: |
        if ! git diff --quiet docs/; then
          echo "❌ ERROR: docs/ is out of date!"
          echo ""
          echo "The source files in src/ were modified, but docs/ wasn't rebuilt."
          echo "Please run the build script and commit the updated docs/:"
          echo ""
          echo "  cd src && python3 build.py"
          echo "  git add docs/"
          echo "  git commit --amend --no-edit"
          echo "  git push --force-with-lease"
          echo ""
          echo "Changed files:"
          git diff --name-only docs/
          exit 1
        else
          echo "✅ docs/ is up to date"
        fi
    
    - name: Verify HTML files exist
      run: |
        for page in index about products contact; do
          if [ ! -f "docs/${page}.html" ]; then
            echo "❌ ERROR: docs/${page}.html is missing!"
            exit 1
          fi
        done
        echo "✅ All required HTML files exist"
